services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ventas_db
      POSTGRES_USER: pipeline_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pipeline_user -d ventas_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ventas_db
      DB_USER: pipeline_user
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: